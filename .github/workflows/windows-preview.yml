name: Windows preview build

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/field-survey-ux']
    paths:
      - '**.py'
      - 'Lumination.spec'
      - 'requirements*.txt'
      - '.github/workflows/windows-preview.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-windows-build.txt
      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements-windows-build.txt
      - name: Test the Windows source build
        env:
          QT_QPA_PLATFORM: windows
          LUMINATION_UI_SCREENSHOTS: build-artifacts/ui
        run: python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); import pytest; raise SystemExit(pytest.main(['-q', 'tests', '--junitxml=build-artifacts/tests.xml']))"
      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean Lumination.spec
      - name: Smoke-test the actual packaged Windows executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $report = Join-Path $pwd 'build-smoke.json'
          $process = Start-Process -FilePath '.\dist\Lumination\Lumination.exe' -ArgumentList @('--smoke-test', $report) -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Packaged application did not complete its smoke test within two minutes.'
          }
          if (-not (Test-Path $report)) { throw 'Packaged application did not produce a smoke-test report.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          Get-Content $report
          if ($process.ExitCode -ne 0 -or -not $result.success) { throw 'Packaged Windows application smoke test failed.' }
      - name: Record the build and package it
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Out-File 'dist/Lumination/BUILD_INFO.txt' -Encoding utf8
          python --version | Out-File 'dist/Lumination/BUILD_INFO.txt' -Append -Encoding utf8
          python -m pip freeze | Out-File 'dist/Lumination/BUILD_INFO.txt' -Append -Encoding utf8
          Copy-Item 'build-smoke.json' 'dist/Lumination/build-smoke.json'
          python package_release.py
          $hash = (Get-FileHash 'release/Lumination-windows-x64.zip' -Algorithm SHA256).Hash.ToLower()
          "$hash  Lumination-windows-x64.zip" | Out-File 'release/Lumination-windows-x64.zip.sha256' -Encoding ascii
      - name: Upload the portable Windows ZIP
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Lumination-windows-x64
          path: release/Lumination-windows-x64.zip
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Upload build diagnostics and checksum
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-build-diagnostics
          path: |
            build-artifacts/
            build-smoke.json
            release/Lumination-windows-x64.zip.sha256
            build/Lumination/warn-Lumination.txt
            dist/Lumination/BUILD_INFO.txt
          retention-days: 14
          if-no-files-found: ignore
